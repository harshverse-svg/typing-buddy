name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,grammar]"

      - name: Run Ruff Linting
        run: |
          ruff check .

      - name: Run Test Suite
        run: |
          pytest -v

      - name: Verify Zero Network Code (Privacy Guarantee)
        run: |
          python tools/check_no_network.py

      - name: Verify Zero Personal Data
        run: |
          python tools/check_no_personal_data.py

      - name: Verify Documentation Version Links
        run: |
          python tools/check_docs_version.py
